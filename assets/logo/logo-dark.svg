<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="dev-workflow logo">
  <title>dev-workflow</title>
  <defs>
    <linearGradient id="dw-accent-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- rounded frame: the tool boundary -->
  <rect x="14" y="14" width="172" height="172" rx="32" fill="none" stroke="#e2e8f0" stroke-width="9"/>

  <!-- terminal prompt >_ : dev work happening -->
  <path d="M46 78 L74 100 L46 122" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 128 L112 128" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>

  <!-- checkmark: passed the gate -->
  <path d="M126 100 L144 118 L182 76" fill="none" stroke="url(#dw-accent-dark)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
