name: Bug report
description: Something in dev-workflow itself misbehaves — a skill's output, a gate, a generated artifact.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a bug in the *product/ticket you're building with dev-workflow*, this isn't the right
        place — that belongs in your own project's tracker. This is for dev-workflow's own skills,
        gates, or generated artifacts misbehaving.

        If you're using Claude Code, `/dev-workflow:feedback [what went wrong]` can file this for
        you automatically after asking you to confirm the title/body.

  - type: input
    id: host
    attributes:
      label: Host
      description: Claude Code, Cursor, Codex, or Antigravity — and version if known.
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command run
      description: e.g. `/dev-workflow:clarify TICKET-123`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: >-
        Paste the relevant skill output, gate error, or generated artifact content. Redact secrets,
        tokens, personal data, and private paths. Suspected security vulnerability? Use SECURITY.md
        instead of this form.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
